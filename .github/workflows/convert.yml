name: Convert Surge to Shadowrocket Modules

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC (10 AM Beijing Time)
  workflow_dispatch:  # Allow manual trigger

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v

    - name: Download current release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p current
        # Download all .module assets from latest release; ignore error if release doesn't exist yet
        gh release download latest --pattern "*.module" --dir current 2>/dev/null || true
        echo "Current assets: $(ls current/*.module 2>/dev/null | wc -l) files"

    - name: Run conversion script
      run: |
        python main.py

    - name: Upload changed modules to latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        changed=()
        for f in output/*.module; do
          name=$(basename "$f")
          if [ ! -f "current/$name" ] || ! cmp -s "$f" "current/$name"; then
            changed+=("$f")
            echo "Changed: $name"
          fi
        done

        if [ ${#changed[@]} -eq 0 ]; then
          echo "No modules changed, skipping release update."
          exit 0
        fi

        echo "${#changed[@]} module(s) changed."

        # Create latest release if it doesn't exist
        if ! gh release view latest &>/dev/null; then
          cat > release_notes.md << 'EOF'
        ## 📦 Shadowrocket 模块

        从 [fmz200/wool_scripts](https://github.com/fmz200/wool_scripts) 自动转换，持续更新。

        ### 📥 使用方法
        1. 下载需要的 `.module` 文件
        2. 在 Shadowrocket 中导入模块并启用

        ---
        🤖 由 GitHub Actions 自动维护
        EOF
          gh release create latest \
            --title "Shadowrocket Modules (latest)" \
            --notes-file release_notes.md \
            --prerelease=false
        fi

        # Update only changed assets
        gh release upload latest "${changed[@]}" --clobber
        echo "Uploaded: ${changed[*]##*/}"
